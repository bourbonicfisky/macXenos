name: Bug report
description: Report a problem with macXenos.
labels: bug
body:
  - id: intro
    type: markdown
    attributes:
      value: |
        Please give the issue a short title that says what goes wrong, for example
        "Halo 3: black screen after the intro video".

        The [troubleshooting guide](https://github.com/bourbonicfisky/xenia-mac/blob/main/docs/troubleshooting.md)
        covers the common problems. Don't ask for help finding games.
  - id: game
    type: input
    attributes:
      label: Game
      description: The game's name, and its title ID if you know it.
  - id: problem
    type: textarea
    attributes:
      label: What goes wrong
    validations:
      required: true
  - id: expected
    type: textarea
    attributes:
      label: What should happen
    validations:
      required: true
  - id: mac
    type: input
    attributes:
      label: Mac and macOS version
      description: For example "MacBook Air M4, macOS 26.1".
    validations:
      required: true
  - id: version
    type: input
    attributes:
      label: macXenos version
      description: From macXenos > About macXenos.
    validations:
      required: true
  - id: renderer
    type: dropdown
    attributes:
      label: Renderer
      description: Shown in the window's title bar.
      options:
        - Metal
        - Vulkan (MoltenVK)
    validations:
      required: true
  - id: logfile
    type: textarea
    attributes:
      label: Log file
      description: Attach `~/Library/Application Support/macXenos/xenia.log` from the run that went wrong.
  - id: extra
    type: textarea
    attributes:
      label: Anything else
      description: Screenshots, a GPU trace (F4) for graphics problems, or a crash report.
