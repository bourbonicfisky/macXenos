# macXenos built-in game patch: NBA Ballers: Chosen One (4D5707DA).
# The title's I/O worker (8233C5EC, and 8233C7C4) clears a device's "ready"
# flag unconditionally when it runs out of work. A submitter that queued a
# read just before that saw the flag still set and did not signal, so the read
# sits in the device queue forever and boot hangs on the first LOADING screen
# (~30% of boots here, 4 in 14; 0 in 12 with this patch). The patch recomputes
# the flag from the device's own has-work check (8233C920) under the device
# lock. It is a race in the game itself; the emulator's lock hand-off may make
# it far likelier than on the console (not investigated: if another title
# shows the same lost-wakeup pattern, look for the emulator-side cause).
# Evidence: xenia-mac-evidence/defects-20261101/nbaballers. A file with this
# name in the storage root's patches/ folder replaces this one (set
# is_enabled = false there to turn it off).
title_name = "NBA Ballers: Chosen One"
title_id = "4D5707DA"
hash = "6C9A948B7511068F"

[[patch]]
    name = "Fix lost I/O wakeup (boot hang on LOADING)"
    desc = "The I/O worker clears a device's ready flag unconditionally when it goes idle (8233C5EC, 8233C7C4), racing with a submitter that queued a request and saw ready already set. Recompute ready = HasWork() under the device lock instead."
    author = "macXenos"
    is_enabled = true

