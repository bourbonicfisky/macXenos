# macXenos built-in per-title config: Assassin's Creed III (555308AE).
# Like Assassin's Creed (555307D4) and Assassin's Creed II (5553083B), the
# AnvilNext engine culls terrain, cave walls, and foliage meshes on occlusion
# query results. With the default fast queries (a guessed result until the
# GPU's arrives), large chunks of the cave wall, ground, and bushes pop in and
# out of existence between frames; strict queries wait for the real result and
# every frame renders cleanly, still holding 60 fps.
# (M1 Max 2 s shots at the opening cave entrance: strict 0/13 gameplay frames
# missing cave/ground/foliage, 60.0 fps median, 0 faults.)
[GPU]
occlusion_query = "strict"
